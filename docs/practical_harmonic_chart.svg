<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="100%">
  <rect width="650" height="250" fill="#ffffff" rx="6" stroke="#e2e8f0" />
  <text x="20" y="24" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" fill="#1e3a8a">FIG 3: PRACTICAL HARMONIC ANALYSIS - DECOMPOSED SPECTRUM &amp; SYNTHESIS</text>

  <!-- Left: Synthesized Wave vs 12 Data Points -->
  <g transform="translate(10, 35)">
    <text x="10" y="18" font-family="'Segoe UI', Arial" font-size="10.5" font-weight="bold" fill="#334155">(a) Field Signal Reconstruction y(x)</text>
    <!-- Axes: x from 0 to 360 deg, width 280; y from 0 to 12, height 140 -->
    <line x1="30" y1="160" x2="310" y2="160" stroke="#64748b" stroke-width="1.2" />
    <line x1="30" y1="160" x2="30" y2="30" stroke="#64748b" stroke-width="1.2" />
    <text x="170" y="178" font-family="'Segoe UI', Arial" font-size="9" fill="#475569" text-anchor="middle">Phase Angle \theta (Degrees)</text>
    <text x="10" y="28" font-family="'Segoe UI', Arial" font-size="8.5" fill="#475569">Amp</text>

    <!-- 12 Data points -->
    <!-- y: [1.8, 4.3, 7.5, 9.8, 10.2, 8.4, 5.1, 2.3, 0.9, 0.4, 0.6, 1.1] -->
    <!-- x_pix: 30 + (deg/360)*260. 0->30, 30->51.7, 60->73.3, 90->95, 120->116.7, 150->138.3, 180->160, 210->181.7, 240->203.3, 270->225, 300->246.7, 330->268.3 -->
    <!-- y_pix: 160 - y * 11.5 -->
    <!-- 1.8->139.3, 4.3->110.5, 7.5->73.7, 9.8->47.3, 10.2->42.7, 8.4->63.4, 5.1->101.3, 2.3->133.5, 0.9->149.6, 0.4->155.4, 0.6->153.1, 1.1->147.3 -->
    <path d="M 30 139.3 Q 51.7 110.5 73.3 73.7 T 95 47.3 T 116.7 42.7 T 138.3 63.4 T 160 101.3 T 181.7 133.5 T 203.3 149.6 T 225 155.4 T 246.7 153.1 T 268.3 147.3 T 290 139.3" fill="none" stroke="#2563eb" stroke-width="2" />

    <circle cx="30" cy="139.3" r="3.5" fill="#dc2626" />
    <circle cx="51.7" cy="110.5" r="3.5" fill="#dc2626" />
    <circle cx="73.3" cy="73.7" r="3.5" fill="#dc2626" />
    <circle cx="95" cy="47.3" r="3.5" fill="#dc2626" />
    <circle cx="116.7" cy="42.7" r="3.5" fill="#dc2626" />
    <circle cx="138.3" cy="63.4" r="3.5" fill="#dc2626" />
    <circle cx="160" cy="101.3" r="3.5" fill="#dc2626" />
    <circle cx="181.7" cy="133.5" r="3.5" fill="#dc2626" />
    <circle cx="203.3" cy="149.6" r="3.5" fill="#dc2626" />
    <circle cx="225" cy="155.4" r="3.5" fill="#dc2626" />
    <circle cx="246.7" cy="153.1" r="3.5" fill="#dc2626" />
    <circle cx="268.3" cy="147.3" r="3.5" fill="#dc2626" />

    <line x1="30" y1="109.8" x2="290" y2="109.8" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" />
    <text x="295" y="112" font-family="'Segoe UI', Arial" font-size="8" fill="#64748b">DC=4.37</text>
  </g>

  <!-- Right: Harmonic Amplitude Spectrum Bar Chart -->
  <g transform="translate(345, 35)">
    <text x="10" y="18" font-family="'Segoe UI', Arial" font-size="10.5" font-weight="bold" fill="#334155">(b) Harmonic Amplitude Spectrum |c_n|</text>
    <!-- Axes -->
    <line x1="30" y1="160" x2="280" y2="160" stroke="#64748b" stroke-width="1.2" />
    <line x1="30" y1="160" x2="30" y2="30" stroke="#64748b" stroke-width="1.2" />

    <!-- c0 = 4.3667 (DC), c1 = 4.9347 (Fund), c2 = 1.1129 (2nd), c3 = 0.0527 (3rd) -->
    <!-- Scale: height max 5.5 -> 120 px => 21.8 px per unit -->
    <!-- DC Bar: height = 4.37*21.8 = 95 px -->
    <rect x="50" y="65" width="35" height="95" fill="#64748b" rx="2" />
    <text x="67.5" y="58" font-family="'Segoe UI', Arial" font-size="8.5" font-weight="bold" fill="#475569" text-anchor="middle">4.37</text>
    <text x="67.5" y="174" font-family="'Segoe UI', Arial" font-size="8.5" fill="#334155" text-anchor="middle">DC (a0/2)</text>

    <!-- Fundamental Bar: height = 4.935*21.8 = 107.6 px -->
    <rect x="105" y="52.4" width="35" height="107.6" fill="#2563eb" rx="2" />
    <text x="122.5" y="45" font-family="'Segoe UI', Arial" font-size="8.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">4.93</text>
    <text x="122.5" y="174" font-family="'Segoe UI', Arial" font-size="8.5" fill="#334155" text-anchor="middle">1st (Fund)</text>

    <!-- 2nd Harmonic: height = 1.113*21.8 = 24.3 px -->
    <rect x="160" y="135.7" width="35" height="24.3" fill="#0d9488" rx="2" />
    <text x="177.5" y="128" font-family="'Segoe UI', Arial" font-size="8.5" font-weight="bold" fill="#0f766e" text-anchor="middle">1.11</text>
    <text x="177.5" y="174" font-family="'Segoe UI', Arial" font-size="8.5" fill="#334155" text-anchor="middle">2nd Harm</text>

    <!-- 3rd Harmonic: height = 0.053*21.8 = 1.2 px -->
    <rect x="215" y="157" width="35" height="3" fill="#e11d48" rx="1" />
    <text x="232.5" y="148" font-family="'Segoe UI', Arial" font-size="8.5" font-weight="bold" fill="#be123c" text-anchor="middle">0.05</text>
    <text x="232.5" y="174" font-family="'Segoe UI', Arial" font-size="8.5" fill="#334155" text-anchor="middle">3rd Harm</text>

    <text x="155" y="196" font-family="'Segoe UI', Arial" font-size="8.5" fill="#64748b" text-anchor="middle">Total Harmonic Distortion (THD) = 22.58%</text>
  </g>
</svg>
