<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <style>
      .wire { stroke: #0f172a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pwr { stroke: #dc2626; stroke-width: 2; fill: none; }
      .gnd { stroke: #2563eb; stroke-width: 2; fill: none; }
      .comp { fill: #ffffff; stroke: #1e3a8a; stroke-width: 2; }
      .label { font-family: 'Liberation Sans', 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #0f172a; }
      .title { font-family: 'Liberation Sans', 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1e3a8a; }
      .unit-tag { font-size: 9.5px; fill: #6b21a8; font-weight: 600; }
      .val { font-size: 10px; fill: #475569; }
      .pin { font-size: 9px; fill: #64748b; font-family: monospace; }
      .node { fill: #0f172a; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Sheet Background -->
  <rect width="1100" height="680" fill="#ffffff"/>
  <rect x="15" y="15" width="1070" height="650" fill="none" stroke="#1e3a8a" stroke-width="2.5" rx="6"/>
  <rect x="22" y="22" width="1056" height="636" fill="none" stroke="#94a3b8" stroke-width="1" rx="4"/>

  <!-- Title Header Block -->
  <rect x="22" y="22" width="1056" height="55" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="45" font-family="'Liberation Sans', sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">
    COMPLETE SCHEMATIC: AUTOMATIC WATER-LEVEL CONTROLLER
  </text>
  <text x="40" y="63" font-family="'Liberation Sans', sans-serif" font-size="11" font-weight="600" fill="#475569">
    GM UNIVERSITY | DEPT OF ECE | COURSE: UE25EC3502 (LINEAR INTEGRATED CIRCUITS) | OP-AMP COMPARATOR &amp; 555 TIMER
  </text>
  <text x="1055" y="45" font-family="'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="end">
    DESIGN SPEC: 40 MARKS PBL
  </text>
  <text x="1055" y="63" font-family="'Liberation Sans', sans-serif" font-size="10" fill="#64748b" text-anchor="end">
    REVISION: 2.4 (FINAL RELEASE)
  </text>

  <!-- Subsystem Grid Boxes -->
  <!-- 1. Power Supply Box -->
  <rect x="35" y="90" width="230" height="230" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <text x="45" y="110" class="title">SECTION A: 7805 POWER SUPPLY</text>
  <text x="45" y="123" class="unit-tag">[Unit 5: Voltage Regulation]</text>

  <!-- 7805 IC Component -->
  <rect x="95" y="145" width="100" height="60" rx="4" class="comp" filter="url(#shadow)"/>
  <text x="145" y="172" class="title" text-anchor="middle">IC 7805</text>
  <text x="145" y="188" class="val" text-anchor="middle">+5V Regulator</text>
  <text x="100" y="160" class="pin">IN</text>
  <text x="180" y="160" class="pin">OUT</text>
  <text x="145" y="200" class="pin" text-anchor="middle">GND</text>

  <!-- 12V In Wire -->
  <line x1="45" y1="165" x2="95" y2="165" class="wire"/>
  <circle cx="45" cy="165" r="3" class="node"/>
  <text x="45" y="155" class="label" font-weight="700" fill="#dc2626">+12V DC</text>
  <text x="45" y="180" class="val">Adapter / Batt</text>

  <!-- Cin capacitor -->
  <line x1="75" y1="165" x2="75" y2="240" class="wire"/>
  <circle cx="75" cy="165" r="3" class="node"/>
  <!-- Capacitor C1 symbol -->
  <line x1="68" y1="205" x2="82" y2="205" class="wire"/>
  <line x1="68" y1="210" x2="82" y2="210" class="wire"/>
  <text x="86" y="210" class="val">C1: 0.33µF</text>

  <!-- 7805 GND -->
  <line x1="145" y1="205" x2="145" y2="240" class="wire"/>

  <!-- Cout capacitor -->
  <line x1="215" y1="165" x2="215" y2="240" class="wire"/>
  <circle cx="215" cy="165" r="3" class="node"/>
  <!-- Capacitor C2 symbol -->
  <line x1="208" y1="205" x2="222" y2="205" class="wire"/>
  <line x1="208" y1="210" x2="222" y2="210" class="wire"/>
  <text x="226" y="210" class="val">C2: 0.1µF</text>

  <!-- Ground Rail for Section A -->
  <line x1="65" y1="240" x2="235" y2="240" class="wire"/>
  <line x1="135" y1="240" x2="155" y2="240" class="wire" stroke-width="2"/>
  <line x1="140" y1="245" x2="150" y2="245" class="wire" stroke-width="2"/>
  <line x1="143" y1="250" x2="147" y2="250" class="wire" stroke-width="2"/>
  <text x="145" y="265" class="val" text-anchor="middle">GND (Common)</text>

  <!-- +5V Out Rail -->
  <line x1="195" y1="165" x2="255" y2="165" class="wire"/>
  <circle cx="255" cy="165" r="3" class="node"/>
  <text x="255" y="155" class="label" font-weight="700" fill="#047857">+5V (Vcc)</text>

  <!-- Section B: Water Sensing Probes & Reference Network -->
  <rect x="35" y="340" width="230" height="305" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <text x="45" y="360" class="title">SECTION B: WATER PROBES</text>
  <text x="45" y="373" class="unit-tag">[Unit 1: Sensing &amp; Biasing]</text>

  <!-- Overhead Tank Graphic -->
  <rect x="55" y="390" width="120" height="150" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="57" y="450" width="116" height="88" fill="#bae6fd" opacity="0.6"/>
  <text x="115" y="525" class="title" fill="#0284c7" opacity="0.6" text-anchor="middle">WATER</text>

  <!-- Probe Common (+5V) -->
  <line x1="75" y1="380" x2="75" y2="520" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="75" cy="520" r="3.5" fill="#b45309"/>
  <text x="75" y="375" class="pin" fill="#b45309" text-anchor="middle">COM (+5V)</text>

  <!-- Probe Low -->
  <line x1="115" y1="380" x2="115" y2="480" stroke="#0284c7" stroke-width="2.5"/>
  <circle cx="115" cy="480" r="3.5" fill="#0284c7"/>
  <text x="115" y="375" class="pin" fill="#0284c7" text-anchor="middle">PROBE_L</text>

  <!-- Probe High -->
  <line x1="150" y1="380" x2="150" y2="420" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="150" cy="420" r="3.5" fill="#dc2626"/>
  <text x="150" y="375" class="pin" fill="#dc2626" text-anchor="middle">PROBE_H</text>

  <!-- Pull-down resistors & noise filters -->
  <text x="60" y="565" class="label" font-weight="600">Interface Network:</text>
  <text x="60" y="582" class="val">• Pull-down: 100kΩ each</text>
  <text x="60" y="597" class="val">• De-noise Caps: 0.1µF</text>
  <text x="60" y="612" class="val">• R_water: 1kΩ to 10kΩ</text>
  <text x="60" y="627" class="val">• V_dry: 0V | V_wet: ~4.7V</text>

  <!-- Section C: Op-Amp Comparators & Schmitt Trigger -->
  <rect x="285" y="90" width="300" height="555" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <text x="295" y="110" class="title">SECTION C: LM358 OP-AMP COMPARATORS</text>
  <text x="295" y="123" class="unit-tag">[Unit 2 &amp; Unit 3: Comparators &amp; Schmitt Trigger Hysteresis]</text>

  <!-- Reference Potential Divider (R1, R2, R3 = 10k) -->
  <text x="300" y="150" class="label" font-weight="700">Reference Divider:</text>
  <line x1="330" y1="165" x2="330" y2="295" class="wire"/>
  <circle cx="330" cy="165" r="3" class="node"/>
  <text x="330" y="158" class="val" fill="#047857">+5V</text>

  <!-- R1 -->
  <rect x="323" y="175" width="14" height="26" class="comp"/>
  <text x="345" y="192" class="val">R1: 10kΩ</text>

  <!-- Tap 1: V_ref_high = 3.33V (2/3 Vcc) -->
  <circle cx="330" cy="215" r="3.5" fill="#dc2626"/>
  <line x1="330" y1="215" x2="390" y2="215" class="wire"/>
  <text x="338" y="210" class="pin" fill="#dc2626">V_ref_H (3.33V)</text>

  <!-- R2 -->
  <rect x="323" y="225" width="14" height="26" class="comp"/>
  <text x="345" y="242" class="val">R2: 10kΩ</text>

  <!-- Tap 2: V_ref_low = 1.67V (1/3 Vcc) -->
  <circle cx="330" cy="265" r="3.5" fill="#0284c7"/>
  <line x1="330" y1="265" x2="390" y2="265" class="wire"/>
  <text x="338" y="260" class="pin" fill="#0284c7">V_ref_L (1.67V)</text>

  <!-- R3 -->
  <rect x="323" y="275" width="14" height="26" class="comp"/>
  <text x="345" y="292" class="val">R3: 10kΩ</text>
  <line x1="330" y1="301" x2="330" y2="315" class="wire"/>
  <!-- GND symbol -->
  <line x1="322" y1="315" x2="338" y2="315" class="wire"/>
  <line x1="325" y1="319" x2="335" y2="319" class="wire"/>

  <!-- Op-Amp 1: Low Level Comparator with Schmitt Hysteresis -->
  <!-- Triangle 1 -->
  <polygon points="400,320 400,400 470,360" class="comp" filter="url(#shadow)"/>
  <text x="408" y="345" class="label" font-weight="700">-</text>
  <text x="408" y="385" class="label" font-weight="700">+</text>
  <text x="420" y="364" class="title" font-size="11">OP1</text>
  <text x="415" y="377" class="pin">LM358</text>

  <!-- Inverting input: Connected to V_ref_low (1.67V) -->
  <line x1="390" y1="265" x2="390" y2="340" class="wire"/>
  <line x1="390" y1="340" x2="400" y2="340" class="wire"/>

  <!-- Non-inverting input: Connected to PROBE_L through Rin -->
  <line x1="265" y1="380" x2="350" y2="380" class="wire"/>
  <rect x="350" y="373" width="24" height="14" class="comp"/>
  <text x="362" y="367" class="val" text-anchor="middle">R_in: 10k</text>
  <line x1="374" y1="380" x2="400" y2="380" class="wire"/>
  <circle cx="385" cy="380" r="3" class="node"/>

  <!-- Feedback Resistor Rf (Hysteresis) from output to non-inv input -->
  <line x1="385" y1="380" x2="385" y2="425" class="wire"/>
  <line x1="385" y1="425" x2="430" y2="425" class="wire"/>
  <rect x="430" y="418" width="30" height="14" class="comp"/>
  <text x="445" y="412" class="val" text-anchor="middle">Rf: 470kΩ</text>
  <line x1="460" y1="425" x2="495" y2="425" class="wire"/>
  <line x1="495" y1="425" x2="495" y2="360" class="wire"/>
  <circle cx="495" cy="360" r="3" class="node"/>

  <!-- Op-Amp 1 Output -->
  <line x1="470" y1="360" x2="560" y2="360" class="wire"/>
  <circle cx="560" cy="360" r="3" class="node"/>
  <text x="500" y="352" class="pin" font-weight="700">V_COMP_LOW</text>

  <!-- Op-Amp 2: High Level Comparator -->
  <!-- Triangle 2 -->
  <polygon points="400,480 400,560 470,520" class="comp" filter="url(#shadow)"/>
  <text x="408" y="505" class="label" font-weight="700">+</text>
  <text x="408" y="545" class="label" font-weight="700">-</text>
  <text x="420" y="524" class="title" font-size="11">OP2</text>
  <text x="415" y="537" class="pin">LM358</text>

  <!-- Non-inverting input: Connected to PROBE_H -->
  <line x1="265" y1="500" x2="400" y2="500" class="wire"/>

  <!-- Inverting input: Connected to V_ref_high (3.33V) -->
  <line x1="390" y1="215" x2="390" y2="540" class="wire"/>
  <line x1="390" y1="540" x2="400" y2="540" class="wire"/>

  <!-- Op-Amp 2 Output -->
  <line x1="470" y1="520" x2="560" y2="520" class="wire"/>
  <circle cx="560" cy="520" r="3" class="node"/>
  <text x="500" y="512" class="pin" font-weight="700">V_COMP_HIGH</text>

  <!-- Schmitt Trigger Formulas note -->
  <rect x="295" y="580" width="280" height="55" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="305" y="598" class="val" font-weight="700">Schmitt Trigger Hysteresis Values:</text>
  <text x="305" y="613" class="val">• V_UTP = 3.33V | V_LTP = 1.67V</text>
  <text x="305" y="626" class="val">• Hysteresis Band: ΔV = 1.66V (Suppresses Wave Ripples)</text>

  <!-- Section D: NE555 Timer Stage -->
  <rect x="605" y="90" width="220" height="555" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <text x="615" y="110" class="title">SECTION D: 555 TIMER STAGE</text>
  <text x="615" y="123" class="unit-tag">[Unit 5: Monostable &amp; Latch Timing]</text>

  <!-- NE555 DIP-8 IC -->
  <rect x="645" y="240" width="140" height="200" rx="6" class="comp" filter="url(#shadow)"/>
  <text x="715" y="275" class="title" text-anchor="middle" font-size="14">IC NE555</text>
  <text x="715" y="292" class="val" text-anchor="middle">Timing &amp; Latch</text>

  <!-- Pins Left: Pin 4 (Reset), Pin 2 (Trigger), Pin 6 (Threshold), Pin 7 (Discharge) -->
  <text x="652" y="318" class="pin">4: RESET</text>
  <line x1="560" y1="315" x2="645" y2="315" class="wire"/>

  <text x="652" y="358" class="pin">2: TRIG</text>
  <line x1="560" y1="360" x2="645" y2="360" class="wire"/>

  <text x="652" y="398" class="pin">6: THRESH</text>
  <text x="652" y="423" class="pin">7: DISCH</text>

  <!-- Timing components for Pin 6 & 7: Ra = 100k, C = 47uF -->
  <line x1="645" y1="395" x2="630" y2="395" class="wire"/>
  <line x1="645" y1="420" x2="630" y2="420" class="wire"/>
  <line x1="630" y1="395" x2="630" y2="420" class="wire"/>
  <line x1="630" y1="410" x2="615" y2="410" class="wire"/>

  <!-- Pins Right: Pin 8 (VCC), Pin 3 (OUT), Pin 5 (CV), Pin 1 (GND) -->
  <text x="745" y="318" class="pin">8: VCC</text>
  <line x1="785" y1="315" x2="810" y2="315" class="wire"/>
  <text x="815" y="319" class="pin" fill="#dc2626">+5V</text>

  <text x="745" y="358" class="pin">3: OUT</text>
  <line x1="785" y1="360" x2="840" y2="360" class="wire"/>
  <circle cx="840" cy="360" r="3" class="node"/>

  <text x="745" y="398" class="pin">5: CTRL</text>
  <line x1="785" y1="395" x2="805" y2="395" class="wire"/>
  <!-- Cap 0.01uF to GND -->
  <rect x="805" y="390" width="10" height="10" class="comp"/>
  <text x="800" y="415" class="val">0.01µF</text>

  <text x="745" y="423" class="pin">1: GND</text>
  <line x1="785" y1="420" x2="810" y2="420" class="wire"/>

  <!-- High-Level Cutoff path from OP2 to Pin 4 (RESET) / Pin 6 -->
  <line x1="560" y1="520" x2="590" y2="520" class="wire"/>
  <line x1="590" y1="520" x2="590" y2="315" class="wire"/>
  <line x1="590" y1="315" x2="645" y2="315" class="wire"/>

  <!-- 555 Monostable Formula -->
  <rect x="615" y="480" width="200" height="145" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="625" y="505" class="title" fill="#4c1d95" font-size="11">Anti-Slosh Monostable:</text>
  <text x="625" y="525" class="label" font-weight="700">T = 1.1 × Ra × C1</text>
  <text x="625" y="545" class="val">• Ra = 100 kΩ</text>
  <text x="625" y="562" class="val">• C1 = 47 µF (T = 5.17s)</text>
  <text x="625" y="582" class="val">• Masks splashing wave</text>
  <text x="625" y="597" class="val">  surges on pump start/stop</text>
  <text x="625" y="615" class="val">• Bistable Latch holds state</text>

  <!-- Section E: Relay Driver, Indicators & Actuator -->
  <rect x="845" y="90" width="220" height="555" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <text x="855" y="110" class="title">SECTION E: RELAY &amp; PUMP</text>
  <text x="855" y="123" class="unit-tag">[Driver Stage &amp; Flyback Protection]</text>

  <!-- Base Resistor Rb -->
  <line x1="840" y1="360" x2="880" y2="360" class="wire"/>
  <rect x="880" y="353" width="26" height="14" class="comp"/>
  <text x="893" y="347" class="val" text-anchor="middle">Rb: 1kΩ</text>
  <line x1="906" y1="360" x2="930" y2="360" class="wire"/>

  <!-- NPN Transistor BC547 -->
  <circle cx="945" cy="360" r="18" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="935" y1="348" x2="935" y2="372" stroke="#1e3a8a" stroke-width="2.5"/>
  <line x1="930" y1="360" x2="935" y2="360" class="wire"/>
  <!-- Collector line -->
  <line x1="935" y1="353" x2="952" y2="340" class="wire"/>
  <line x1="952" y1="340" x2="952" y2="310" class="wire"/>
  <!-- Emitter line with arrow -->
  <line x1="935" y1="367" x2="952" y2="380" class="wire"/>
  <polygon points="948,375 955,382 944,382" fill="#0f172a"/>
  <line x1="952" y1="380" x2="952" y2="405" class="wire"/>
  <line x1="944" y1="405" x2="960" y2="405" class="wire"/>
  <text x="968" y="365" class="label" font-weight="700">BC547</text>
  <text x="968" y="378" class="val">NPN Driver</text>

  <!-- Relay Coil & Snubber Diode -->
  <rect x="925" y="220" width="55" height="50" rx="4" class="comp" filter="url(#shadow)"/>
  <text x="952" y="240" class="title" font-size="10" text-anchor="middle">RELAY</text>
  <text x="952" y="255" class="val" text-anchor="middle">12V SPDT</text>

  <!-- Flyback Diode 1N4007 across coil -->
  <line x1="1000" y1="225" x2="1000" y2="265" class="wire"/>
  <polygon points="995,250 1005,250 1000,240" fill="#1e3a8a"/>
  <line x1="995" y1="240" x2="1005" y2="240" stroke="#1e3a8a" stroke-width="2"/>
  <text x="1010" y="248" class="val" font-weight="600">1N4007</text>
  <text x="1010" y="260" class="pin">Flyback</text>

  <!-- Wires connecting Coil & Diode -->
  <line x1="952" y1="220" x2="952" y2="190" class="wire"/>
  <line x1="1000" y1="225" x2="1000" y2="190" class="wire"/>
  <line x1="952" y1="190" x2="1000" y2="190" class="wire"/>
  <circle cx="952" cy="190" r="3" class="node"/>
  <line x1="952" y1="190" x2="952" y2="165" class="wire"/>
  <circle cx="952" cy="165" r="3" class="node"/>
  <text x="955" y="158" class="label" font-weight="700" fill="#dc2626">+12V Supply</text>

  <line x1="952" y1="270" x2="952" y2="310" class="wire"/>
  <line x1="1000" y1="265" x2="1000" y2="290" class="wire"/>
  <line x1="1000" y1="290" x2="952" y2="290" class="wire"/>
  <circle cx="952" cy="290" r="3" class="node"/>

  <!-- Relay Switch Contacts: NO, COM, NC -->
  <circle cx="995" cy="450" r="3.5" fill="#0f172a"/>
  <text x="975" y="454" class="pin">COM</text>
  <circle cx="1040" cy="435" r="3.5" fill="#0f172a"/>
  <text x="1045" y="438" class="pin">NO</text>
  <circle cx="1040" cy="465" r="3.5" fill="#0f172a"/>
  <text x="1045" y="468" class="pin">NC</text>
  <line x1="995" y1="450" x2="1035" y2="438" stroke="#1e3a8a" stroke-width="2.5"/>

  <!-- 12V Water Pump -->
  <circle cx="1015" cy="535" r="28" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="535" class="title" text-anchor="middle" font-size="11" fill="#be123c">PUMP</text>
  <text x="1015" y="550" class="val" text-anchor="middle">12V DC</text>
  <line x1="1040" y1="435" x2="1040" y2="520" class="wire"/>
  <line x1="1040" y1="520" x2="1035" y2="520" class="wire"/>

  <!-- Status Indicator LEDs Box -->
  <rect x="855" y="575" width="200" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="875" cy="595" r="5" fill="#22c55e"/>
  <text x="886" y="599" class="val">Green: Tank Full (Cutoff)</text>
  <circle cx="875" cy="615" r="5" fill="#ef4444"/>
  <text x="886" y="619" class="val">Red: Tank Empty (Request)</text>
  <circle cx="975" cy="595" r="5" fill="#3b82f6"/>
  <text x="986" y="599" class="val">Blue: Pump Run</text>
  <circle cx="975" cy="615" r="5" fill="#f59e0b"/>
  <text x="986" y="619" class="val">Buzzer: Overflow</text>
</svg>
