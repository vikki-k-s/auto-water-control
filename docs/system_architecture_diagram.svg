<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gradTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="gradIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a8a" />
    </marker>
  </defs>

  <rect width="900" height="320" fill="#f8fafc" rx="8" />
  <rect x="10" y="10" width="880" height="300" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" rx="6" />
  <text x="30" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">FIG 1: ARCHITECTURE OF SMART ENGINEERING SYSTEM INTEGRATING UNITS 1 - 6</text>

  <!-- Block 1: Transducers & Unit 1 -->
  <g transform="translate(30, 60)" filter="url(#shadow)">
    <rect width="180" height="100" rx="6" fill="url(#gradBlue)" />
    <text x="90" y="28" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">UNIT 1: TRANSDUCERS</text>
    <text x="90" y="48" font-family="'Segoe UI', Arial" font-size="9.5" fill="#e2e8f0" text-anchor="middle">Empirical Data Acquisition</text>
    <text x="90" y="65" font-family="'Segoe UI', Arial" font-size="9" fill="#bfdbfe" text-anchor="middle">Least Squares Curve Fitting</text>
    <text x="90" y="82" font-family="'Segoe UI', Arial" font-size="8.5" fill="#bfdbfe" text-anchor="middle">Pearson r = 0.9753 &amp; Regr.</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="210" y1="110" x2="250" y2="110" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Block 2: Periodic Signal & Unit 2/3 -->
  <g transform="translate(255, 60)" filter="url(#shadow)">
    <rect width="180" height="100" rx="6" fill="url(#gradTeal)" />
    <text x="90" y="28" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">UNITS 2 &amp; 3: HARMONICS</text>
    <text x="90" y="48" font-family="'Segoe UI', Arial" font-size="9.5" fill="#e2e8f0" text-anchor="middle">Fourier Series (2pi &amp; 2L)</text>
    <text x="90" y="65" font-family="'Segoe UI', Arial" font-size="9" fill="#ccfbf1" text-anchor="middle">Half-Range Cos/Sin Series</text>
    <text x="90" y="82" font-family="'Segoe UI', Arial" font-size="8.5" fill="#ccfbf1" text-anchor="middle">12-Point Practical Analysis</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="435" y1="110" x2="475" y2="110" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Block 3: Spectral Transform & Unit 4 -->
  <g transform="translate(480, 60)" filter="url(#shadow)">
    <rect width="180" height="100" rx="6" fill="url(#gradIndigo)" />
    <text x="90" y="28" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">UNIT 4: SPECTRAL FILTER</text>
    <text x="90" y="48" font-family="'Segoe UI', Arial" font-size="9.5" fill="#e2e8f0" text-anchor="middle">Infinite Fourier Transform</text>
    <text x="90" y="65" font-family="'Segoe UI', Arial" font-size="9" fill="#e0e7ff" text-anchor="middle">Cosine &amp; Sine Transforms</text>
    <text x="90" y="82" font-family="'Segoe UI', Arial" font-size="8.5" fill="#e0e7ff" text-anchor="middle">Parseval Energy &amp; Low-Pass</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="660" y1="110" x2="700" y2="110" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Block 4: Stochastic & Markov (Units 5 & 6) -->
  <g transform="translate(705, 60)" filter="url(#shadow)">
    <rect width="165" height="100" rx="6" fill="url(#gradAmber)" />
    <text x="82" y="28" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">UNITS 5 &amp; 6: RELIABILITY</text>
    <text x="82" y="48" font-family="'Segoe UI', Arial" font-size="9.5" fill="#fef3c7" text-anchor="middle">Noise &amp; Failure Models</text>
    <text x="82" y="65" font-family="'Segoe UI', Arial" font-size="9" fill="#fef3c7" text-anchor="middle">Binom, Poisson, Norm, Exp</text>
    <text x="82" y="82" font-family="'Segoe UI', Arial" font-size="8.5" fill="#fef3c7" text-anchor="middle">Markov Steady-State (pi)</text>
  </g>

  <!-- Feedback and Control Supervisory Bus -->
  <path d="M 787 160 L 787 230 L 120 230 L 120 160" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <rect x="330" y="215" width="240" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" />
  <text x="450" y="235" font-family="'Segoe UI', Arial" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">Real-Time Autonomous Supervisory Loop</text>

  <!-- Bottom Labels -->
  <text x="120" y="275" font-family="'Segoe UI', Arial" font-size="9" fill="#64748b" text-anchor="middle">Optimal Calibration Curve</text>
  <text x="345" y="275" font-family="'Segoe UI', Arial" font-size="9" fill="#64748b" text-anchor="middle">Fundamental &amp; Harmonic Decoupling</text>
  <text x="570" y="275" font-family="'Segoe UI', Arial" font-size="9" fill="#64748b" text-anchor="middle">Continuous Frequency Domain</text>
  <text x="787" y="275" font-family="'Segoe UI', Arial" font-size="9" fill="#64748b" text-anchor="middle">Risk &amp; Availability State</text>
</svg>
