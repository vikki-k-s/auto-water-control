<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="100%" height="100%">
  <rect width="650" height="240" fill="#ffffff" rx="6" stroke="#e2e8f0" />
  <text x="20" y="22" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" fill="#1e3a8a">FIG 4: PROBABILISTIC RELIABILITY &amp; GAUSSIAN SENSOR NOISE MODELS</text>

  <!-- Left: Exponential Reliability Curve R(t) = exp(-lambda t) -->
  <g transform="translate(10, 30)">
    <text x="10" y="18" font-family="'Segoe UI', Arial" font-size="10.5" font-weight="bold" fill="#334155">(a) Exponential Actuator Reliability R(t)</text>
    <line x1="30" y1="150" x2="280" y2="150" stroke="#64748b" stroke-width="1.2" />
    <line x1="30" y1="150" x2="30" y2="30" stroke="#64748b" stroke-width="1.2" />
    <text x="150" y="168" font-family="'Segoe UI', Arial" font-size="9" fill="#475569" text-anchor="middle">Operating Time t (Hours)</text>
    <text x="12" y="26" font-family="'Segoe UI', Arial" font-size="8.5" fill="#475569">R(t)</text>

    <!-- Curve: t from 0 to 4000 hrs. t=0->1.0(y=35), t=500->0.779(y=60), t=1000->0.607(y=79), t=2000->0.368(y=108), t=4000->0.135(y=135) -->
    <!-- x_pix: 30 to 270 (width 240 => 16.6 hrs per px, 60 px per 1000 hrs) -->
    <path d="M 30 35 Q 90 60 150 79 T 270 135" fill="none" stroke="#2563eb" stroke-width="2.2" />
    <!-- Highlight MTBF = 2000 hrs -->
    <line x1="150" y1="30" x2="150" y2="150" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="150" cy="108" r="4" fill="#d97706" />
    <text x="155" y="104" font-family="'Segoe UI', Arial" font-size="8.5" font-weight="bold" fill="#b45309">MTBF=2000h (36.8%)</text>
    <text x="150" y="162" font-family="'Segoe UI', Arial" font-size="8" fill="#d97706" text-anchor="middle">2000</text>
  </g>

  <!-- Right: Normal Noise Distribution Bell Curve N(5.0, 0.08^2) -->
  <g transform="translate(330, 30)">
    <text x="10" y="18" font-family="'Segoe UI', Arial" font-size="10.5" font-weight="bold" fill="#334155">(b) Gaussian Sensor Voltage Noise N(5.00V, 0.08²)</text>
    <line x1="30" y1="150" x2="290" y2="150" stroke="#64748b" stroke-width="1.2" />
    <line x1="160" y1="150" x2="160" y2="30" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 2" />
    <text x="160" y="168" font-family="'Segoe UI', Arial" font-size="9" fill="#475569" text-anchor="middle">Sensor Voltage V (Volts)</text>

    <!-- Gaussian Shaded In-Spec Region: [-2.5 sigma, +2.5 sigma] -> [4.80V, 5.20V] -->
    <!-- Center at x=160 (5.00V). sigma = 0.08V -> 35 px per sigma. 2.5 sigma = 87.5 px -> x_left = 72.5, x_right = 247.5 -->
    <path d="M 72.5 142 Q 115 130 140 60 Q 160 35 180 60 Q 205 130 247.5 142 L 247.5 150 L 72.5 150 Z" fill="#dcfce7" />
    <path d="M 40 148 Q 72.5 142 115 130 Q 140 60 160 35 Q 180 60 205 130 Q 247.5 142 280 148" fill="none" stroke="#16a34a" stroke-width="2.2" />

    <!-- Spec limit lines -->
    <line x1="72.5" y1="40" x2="72.5" y2="150" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3" />
    <line x1="247.5" y1="40" x2="247.5" y2="150" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3" />

    <text x="72.5" y="162" font-family="'Segoe UI', Arial" font-size="7.5" fill="#dc2626" text-anchor="middle">4.80V (-2.5\sigma)</text>
    <text x="160" y="162" font-family="'Segoe UI', Arial" font-size="7.5" fill="#15803d" text-anchor="middle">\mu = 5.00V</text>
    <text x="247.5" y="162" font-family="'Segoe UI', Arial" font-size="7.5" fill="#dc2626" text-anchor="middle">5.20V (+2.5\sigma)</text>

    <text x="160" y="85" font-family="'Segoe UI', Arial" font-size="9" font-weight="bold" fill="#166534" text-anchor="middle">In-Spec: 98.76%</text>
    <text x="265" y="130" font-family="'Segoe UI', Arial" font-size="7.5" fill="#dc2626">Fault: 1.24%</text>
  </g>
</svg>
