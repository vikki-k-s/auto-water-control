<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="100%">
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a8a" />
    </marker>
    <filter id="m-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="650" height="250" fill="#ffffff" rx="6" stroke="#e2e8f0" />

  <!-- State 1: Normal Operation -->
  <g transform="translate(110, 125)" filter="url(#m-shadow)">
    <circle r="45" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
    <text x="0" y="-8" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">State 1 (S1)</text>
    <text x="0" y="10" font-family="'Segoe UI', Arial" font-size="9.5" fill="#166534" text-anchor="middle">Normal</text>
    <text x="0" y="26" font-family="'Segoe UI', Arial" font-size="9" font-weight="bold" fill="#14532d" text-anchor="middle">pi1 = 61.22%</text>
  </g>
  <!-- S1 Self Loop -->
  <path d="M 85 90 C 50 40, 110 30, 115 80" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#m-arrow)" />
  <text x="80" y="35" font-family="'Segoe UI', Arial" font-size="10" font-weight="bold" fill="#15803d">p11 = 0.85</text>

  <!-- State 2: Degraded Warning -->
  <g transform="translate(325, 125)" filter="url(#m-shadow)">
    <circle r="45" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" />
    <text x="0" y="-8" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">State 2 (S2)</text>
    <text x="0" y="10" font-family="'Segoe UI', Arial" font-size="9.5" fill="#92400e" text-anchor="middle">Degraded</text>
    <text x="0" y="26" font-family="'Segoe UI', Arial" font-size="9" font-weight="bold" fill="#78350f" text-anchor="middle">pi2 = 31.63%</text>
  </g>
  <!-- S2 Self Loop -->
  <path d="M 300 90 C 265 40, 325 30, 330 80" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-arrow)" />
  <text x="295" y="35" font-family="'Segoe UI', Arial" font-size="10" font-weight="bold" fill="#b45309">p22 = 0.70</text>

  <!-- State 3: Critical Outage -->
  <g transform="translate(540, 125)" filter="url(#m-shadow)">
    <circle r="45" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" />
    <text x="0" y="-8" font-family="'Segoe UI', Arial" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">State 3 (S3)</text>
    <text x="0" y="10" font-family="'Segoe UI', Arial" font-size="9.5" fill="#991b1b" text-anchor="middle">Critical</text>
    <text x="0" y="26" font-family="'Segoe UI', Arial" font-size="9" font-weight="bold" fill="#7f1d1d" text-anchor="middle">pi3 = 7.14%</text>
  </g>
  <!-- S3 Self Loop -->
  <path d="M 515 90 C 480 40, 540 30, 545 80" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#m-arrow)" />
  <text x="510" y="35" font-family="'Segoe UI', Arial" font-size="10" font-weight="bold" fill="#b91c1c">p33 = 0.30</text>

  <!-- Transitions S1 <-> S2 -->
  <path d="M 155 110 Q 220 90 280 110" fill="none" stroke="#1e3a8a" stroke-width="1.8" marker-end="url(#m-arrow)" />
  <text x="210" y="95" font-family="'Segoe UI', Arial" font-size="9.5" font-weight="bold" fill="#1e3a8a">p12 = 0.12</text>

  <path d="M 280 140 Q 220 160 155 140" fill="none" stroke="#1e3a8a" stroke-width="1.8" marker-end="url(#m-arrow)" />
  <text x="210" y="170" font-family="'Segoe UI', Arial" font-size="9.5" font-weight="bold" fill="#1e3a8a">p21 = 0.20</text>

  <!-- Transitions S2 <-> S3 -->
  <path d="M 370 110 Q 435 90 495 110" fill="none" stroke="#1e3a8a" stroke-width="1.8" marker-end="url(#m-arrow)" />
  <text x="425" y="95" font-family="'Segoe UI', Arial" font-size="9.5" font-weight="bold" fill="#1e3a8a">p23 = 0.10</text>

  <path d="M 495 140 Q 435 160 370 140" fill="none" stroke="#1e3a8a" stroke-width="1.8" marker-end="url(#m-arrow)" />
  <text x="425" y="170" font-family="'Segoe UI', Arial" font-size="9.5" font-weight="bold" fill="#1e3a8a">p32 = 0.30</text>

  <!-- S1 -> S3 and S3 -> S1 -->
  <path d="M 140 85 Q 325 0 510 85" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#m-arrow)" />
  <text x="310" y="25" font-family="'Segoe UI', Arial" font-size="9" fill="#475569">p13 = 0.03</text>

  <path d="M 510 165 Q 325 245 140 165" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#m-arrow)" />
  <text x="310" y="235" font-family="'Segoe UI', Arial" font-size="9" fill="#475569">p31 = 0.40 (Reboot/Recovery)</text>
</svg>
