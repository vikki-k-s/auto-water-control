<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="100%" height="100%">
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="420" fill="#ffffff" rx="8"/>
  <rect x="10" y="10" width="730" height="400" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <!-- Title -->
  <text x="375" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">
    SCHMITT TRIGGER HYSTERESIS TRANSFER CHARACTERISTICS
  </text>
  <text x="375" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#64748b">
    LM358 Inverting Comparator with Positive Feedback (Unit 3 LIC)
  </text>

  <!-- Coordinate Axes -->
  <!-- Y Axis: V_out -->
  <line x1="120" y1="340" x2="120" y2="80" stroke="#0f172a" stroke-width="2" marker-end="url(#arrowHead)"/>
  <text x="110" y="75" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#0f172a">V_OUT (V)</text>

  <!-- X Axis: V_in (Sensed Water Voltage) -->
  <line x1="120" y1="340" x2="680" y2="340" stroke="#0f172a" stroke-width="2" marker-end="url(#arrowHead)"/>
  <text x="685" y="345" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">V_IN (V)</text>

  <!-- Grid lines -->
  <line x1="120" y1="130" x2="640" y2="130" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="110" y="134" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="end" fill="#1e3a8a">V_OH (+3.8V)</text>

  <line x1="120" y1="300" x2="640" y2="300" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="110" y="304" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="end" fill="#64748b">V_OL (0.05V)</text>

  <!-- Threshold Vertical Dashes -->
  <!-- V_LTP = 1.67V (Low Threshold) -->
  <line x1="280" y1="80" x2="280" y2="340" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="280" y="360" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">V_LTP = 1.67V</text>
  <text x="280" y="375" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">(Low Water Threshold)</text>

  <!-- V_UTP = 3.33V (High Threshold) -->
  <line x1="480" y1="80" x2="480" y2="340" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="480" y="360" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">V_UTP = 3.33V</text>
  <text x="480" y="375" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">(High Water Threshold)</text>

  <!-- Hysteresis Width Dimension Bar -->
  <line x1="280" y1="210" x2="480" y2="210" stroke="#7c3aed" stroke-width="2" marker-start="url(#arrowHead)" marker-end="url(#arrowHead)"/>
  <rect x="330" y="196" width="100" height="26" rx="4" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="380" y="213" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">
    V_H = 1.66 V
  </text>

  <!-- Hysteresis Loop Path -->
  <!-- High Output line (Vin < V_UTP) -->
  <line x1="120" y1="130" x2="480" y2="130" stroke="#16a34a" stroke-width="3"/>
  <!-- Downward transition at V_UTP -->
  <line x1="480" y1="130" x2="480" y2="300" stroke="#dc2626" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="480" y1="200" x2="480" y2="225" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>

  <!-- Low Output line (Vin > V_LTP) -->
  <line x1="480" y1="300" x2="640" y2="300" stroke="#dc2626" stroke-width="3"/>

  <!-- Lower path moving left until V_LTP -->
  <line x1="280" y1="300" x2="480" y2="300" stroke="#dc2626" stroke-width="3"/>
  <!-- Upward transition at V_LTP -->
  <line x1="280" y1="300" x2="280" y2="130" stroke="#16a34a" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="280" y1="230" x2="280" y2="205" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Direction Arrows on Horizontal Segments -->
  <line x1="330" y1="130" x2="370" y2="130" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="350" y="120" font-family="sans-serif" font-size="9" font-weight="600" fill="#16a34a" text-anchor="middle">Tank Filling (Rising)</text>

  <line x1="430" y1="300" x2="390" y2="300" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="410" y="320" font-family="sans-serif" font-size="9" font-weight="600" fill="#dc2626" text-anchor="middle">Tank Draining (Falling)</text>

  <!-- Side Callout Legend Box -->
  <g transform="translate(525, 95)" filter="url(#shadowBox)">
    <rect width="195" height="135" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="97" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">
      STATE DEFINITION
    </text>
    <rect x="10" y="32" width="175" height="42" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="18" y="48" font-family="sans-serif" font-size="9" font-weight="700" fill="#065f46">V_out = HIGH (+3.8V):</text>
    <text x="18" y="62" font-family="sans-serif" font-size="8.5" fill="#047857">• Water &lt; V_LTP</text>
    <text x="18" y="72" font-family="sans-serif" font-size="8.5" fill="#047857">• PUMP ON (Filling Tank)</text>

    <rect x="10" y="80" width="175" height="42" rx="4" fill="#fef2f2" stroke="#ef4444"/>
    <text x="18" y="96" font-family="sans-serif" font-size="9" font-weight="700" fill="#991b1b">V_out = LOW (0.05V):</text>
    <text x="18" y="110" font-family="sans-serif" font-size="8.5" fill="#b91c1c">• Water &gt; V_UTP</text>
    <text x="18" y="120" font-family="sans-serif" font-size="8.5" fill="#b91c1c">• PUMP OFF (Tank Full)</text>
  </g>
</svg>
